<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tablero de identidad de marca con logo, paleta de colores, tipografía y tarjeta personal">
  <rect width="640" height="480" fill="#e9edf4"/>
  <rect x="50" y="40" width="540" height="400" rx="22" fill="#ffffff"/>

  <!-- Logo -->
  <rect x="80" y="70" width="230" height="230" rx="18" fill="#14284b"/>
  <circle cx="195" cy="185" r="70" fill="none" stroke="#ffffff" stroke-width="5"/>
  <text x="195" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="90" font-weight="800" fill="#ffffff">N</text>

  <!-- Paleta: dos colores -->
  <rect x="330" y="70" width="230" height="110" rx="16" fill="#14284b"/>
  <rect x="330" y="190" width="230" height="110" rx="16" fill="#ffffff" stroke="#dde3ec" stroke-width="3"/>

  <!-- Tipografía -->
  <text x="78" y="400" font-family="Inter, Arial, sans-serif" font-size="100" font-weight="800" fill="#14284b" letter-spacing="-4">Aa</text>

  <!-- Tarjeta personal -->
  <g transform="rotate(-7 450 370)">
    <rect x="330" y="318" width="230" height="124" rx="12" fill="#14284b"/>
    <text x="370" y="372" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">N</text>
    <rect x="356" y="396" width="120" height="12" rx="6" fill="#ffffff"/>
  </g>
</svg>
