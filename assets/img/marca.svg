<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tablero de identidad de marca con logo, paleta de colores, tipografía y tarjeta personal">
  <rect width="640" height="480" fill="#e9edf4"/>
  <circle cx="600" cy="40" r="90" fill="#dde3ec"/>
  <rect x="50" y="40" width="540" height="400" rx="22" fill="#ffffff"/>

  <!-- Logo -->
  <rect x="80" y="70" width="210" height="210" rx="16" fill="#14284b"/>
  <circle cx="185" cy="175" r="64" fill="none" stroke="#ffffff" stroke-width="4"/>
  <text x="185" y="204" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="82" font-weight="800" fill="#ffffff">N</text>

  <!-- Paleta -->
  <rect x="310" y="70" width="125" height="100" rx="12" fill="#14284b"/>
  <text x="324" y="156" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" letter-spacing="1">#14284B</text>
  <rect x="445" y="70" width="115" height="100" rx="12" fill="#ffffff" stroke="#dde3ec" stroke-width="2"/>
  <text x="459" y="156" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#14284b" letter-spacing="1">#FFFFFF</text>
  <rect x="310" y="180" width="80" height="100" rx="12" fill="#4f5d76"/>
  <rect x="398" y="180" width="80" height="100" rx="12" fill="#c3cbd9"/>
  <rect x="486" y="180" width="74" height="100" rx="12" fill="#f4f6fa" stroke="#dde3ec" stroke-width="2"/>

  <!-- Tipografía -->
  <text x="78" y="380" font-family="Inter, Arial, sans-serif" font-size="92" font-weight="800" fill="#14284b" letter-spacing="-4">Aa</text>
  <rect x="214" y="320" width="92" height="10" rx="5" fill="#14284b"/>
  <rect x="214" y="338" width="72" height="7" rx="3.5" fill="#c3cbd9"/>
  <rect x="214" y="352" width="84" height="7" rx="3.5" fill="#c3cbd9"/>
  <text x="82" y="414" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5d76" letter-spacing="2">TIPOGRAFÍA</text>

  <!-- Tarjeta personal -->
  <g transform="rotate(-8 455 365)">
    <rect x="352" y="308" width="214" height="122" rx="10" fill="#14284b"/>
    <circle cx="384" cy="340" r="14" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="384" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff">N</text>
    <rect x="372" y="380" width="96" height="8" rx="4" fill="#ffffff"/>
    <rect x="372" y="396" width="64" height="6" rx="3" fill="#ffffff" opacity=".55"/>
    <rect x="372" y="408" width="78" height="6" rx="3" fill="#ffffff" opacity=".55"/>
  </g>
</svg>
